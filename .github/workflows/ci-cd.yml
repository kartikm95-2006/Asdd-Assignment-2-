name: CI/CD Pipeline - Python & Docker

# Trigger workflow on git push, pull request to main/master, or manual trigger
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Permissions required for publishing Docker container images to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # STAGE 1: BUILD STAGE
  # ==========================================
  build:
    name: 1. Build Application & Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax and Compilation
        run: |
          echo "Validating Python syntax for application and tests..."
          python -m compileall app.py test_app.py
          echo "Python syntax validation passed."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        run: |
          echo "Building Docker image for TaskTrack DevOps application..."
          docker build \
            --tag tasktrack-app:latest \
            --tag tasktrack-app:${{ github.sha }} \
            .
          echo "Docker image built successfully."
          docker images | grep tasktrack-app

  # ==========================================
  # STAGE 2: TEST STAGE
  # ==========================================
  test:
    name: 2. Test Application & Container Health
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Application & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Pytest Suite
        run: |
          echo "Executing automated test suite with pytest..."
          python -m pytest test_app.py -v --junitxml=test-results.xml
          echo "All unit tests executed and passed successfully."

      - name: Build Container for Healthcheck Testing
        run: |
          docker build -t tasktrack-test:latest .

      - name: Execute Live Container Healthcheck
        run: |
          echo "Launching Docker container for runtime verification..."
          docker run -d --name test-container -p 5000:5000 tasktrack-test:latest
          
          echo "Waiting for application to boot up..."
          sleep 6

          echo "Pinging /health endpoint..."
          curl --fail --retry 3 --retry-delay 2 http://localhost:5000/health
          echo -e "\nHealthcheck probe succeeded."

          echo "Stopping test container..."
          docker stop test-container
          docker rm test-container

  # ==========================================
  # STAGE 3: DEPLOY STAGE
  # ==========================================
  deploy:
    name: 3. Deploy Application to Container Registry & Production
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, Tag and Push Image to GHCR
        run: |
          # Lowercase repository string to adhere to Docker naming conventions
          IMAGE_REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Building and pushing container image to: $IMAGE_REPO"
          docker build \
            --tag "$IMAGE_REPO:latest" \
            --tag "$IMAGE_REPO:${{ github.sha }}" \
            .
          
          docker push "$IMAGE_REPO:latest"
          docker push "$IMAGE_REPO:${{ github.sha }}"
          echo "Docker image successfully pushed to GitHub Container Registry."

      - name: Deploy and Verify Production Container
        run: |
          IMAGE_REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Starting production service container..."
          docker run -d \
            --name tasktrack-production \
            --restart always \
            -p 5000:5000 \
            "$IMAGE_REPO:latest"

          echo "Waiting 6 seconds for container initialization..."
          sleep 6

          echo "Testing live production response..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Production Deployment Verified: Application live and returning HTTP 200 OK."
          else
            echo "Verification failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi

      - name: Generate Pipeline Execution Summary
        run: |
          IMAGE_REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "## 🚀 CI/CD Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **1. Build** | ✅ Passed | Python dependencies compiled & Docker image built |" >> $GITHUB_STEP_SUMMARY
          echo "| **2. Test** | ✅ Passed | Pytest test suite (8/8 tests) & Docker container health check |" >> $GITHUB_STEP_SUMMARY
          echo "| **3. Deploy** | ✅ Passed | Image pushed to GHCR & production container verified (HTTP 200) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployment Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Registry:** \`$IMAGE_REPO:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image SHA Tag:** \`$IMAGE_REPO:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pipeline Trigger:** Commit \`${{ github.sha }}\` by \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
